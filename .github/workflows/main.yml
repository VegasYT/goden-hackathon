# Проверки и выкладка на сервер. Запускается только когда коммит попадает в main
# (слияние или прямой push) и вручную со страницы Actions.
# Секреты репозитория: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
# Как их получить и что лежит на сервере: infra/README.md.
# Переменная репозитория SKIP_INTEGRATION_TESTS=true пропускает все тесты и линтеры backend
# и frontend: остаётся только сборка, после неё сразу выкладка.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

# две выкладки одновременно сломали бы друг друга; новая ждёт окончания текущей
concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GOTOOLCHAIN: go1.27.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      # интеграционные тесты сами поднимают PostgreSQL, Kafka и Keycloak в Docker
      - if: vars.SKIP_INTEGRATION_TESTS != 'true'
        run: go test -tags=integration ./...
      - if: vars.SKIP_INTEGRATION_TESTS != 'true'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: vars.SKIP_INTEGRATION_TESTS != 'true'
        run: pnpm check
      - run: pnpm build

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Выкладка на сервер
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "sh ${DEPLOY_PATH}/infra/deploy.sh ${GITHUB_SHA}"
