# Генерация: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
# Новый модуль добавляется отдельным элементом списка sql с теми же настройками.
version: "2"
sql:
  - engine: postgresql
    # схема читается прямо из миграций goose, отдельной копии нет
    schema: migrations
    queries: internal/catalog/queries.sql
    gen:
      go:
        package: db
        out: internal/catalog/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        # без этого в пакет попали бы структуры всех таблиц базы
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
  - engine: postgresql
    schema: migrations
