            $ref: "#/components/schemas/Movement"
        total:
          type: integer
          format: int64
          description: Общее число элементов без учёта limit и offset
    DishRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    DishAvailability:
      type: object
      description: Доступность блюда на момент запроса
      required: [dish, available, portions, limiting, ingredients]
      properties:
        dish:
          $ref: "#/components/schemas/DishRef"
        available:
          type: boolean
          description: Можно ли приготовить хотя бы одну порцию
        portions:
          type: integer
          format: int64
          description: Сколько порций можно приготовить из текущих остатков
        reason:
          type: string
          enum: [no_recipe, insufficient_stock]
          description: Почему блюдо нельзя приготовить. Заполнено только у недоступного блюда.
        limiting:
          type: array
          description: |
            У недоступного блюда - все продукты, которых не хватает на порцию.
            У доступного - продукты, которые определяют число порций.
          items:
            $ref: "#/components/schemas/LimitingIngredient"
        ingredients:
          type: array
          description: Вся рецептура блюда в её порядке, с остатком каждого продукта. У блюда без рецептуры пуст.
          items:
            $ref: "#/components/schemas/LimitingIngredient"
    LimitingIngredient:
      type: object
      required: [product, required_quantity, available_quantity, expired_quantity]
      properties:
        product:
          $ref: "#/components/schemas/Product"
        required_quantity:
          type: integer
          format: int64
          description: Количество на одну порцию, в единице продукта
        available_quantity:
          type: integer
          format: int64
          description: Доступный остаток продукта - партии с неистёкшим сроком годности
        expired_quantity:
          type: integer
          format: int64
          description: Остаток просроченных партий; объясняет, почему продукт есть, но недоступен
    DishAvailabilityPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DishAvailability"
        total:
          type: integer
          format: int64
          description: Общее число элементов без учёта limit и offset
    ExpiringBatch:
      type: object
      required: [batch, product, expired]
      properties:
        batch:
          $ref: "#/components/schemas/Batch"
        product:
          $ref: "#/components/schemas/Product"
        expired:
          type: boolean
          description: Срок годности истёк на момент запроса
    ExpiringBatchPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringBatch"
        total:
          type: integer
          format: int64
          description: Общее число элементов без учёта limit и offset
    DishRecommendation:
      type: object
      description: Горячее предложение
      required: [dish, priority, available_portions, suggested_portions, reasons]
      properties:
        dish:
          $ref: "#/components/schemas/DishRef"
        priority:
          type: integer
          format: int32
          description: Сумма вкладов продуктов под риском, умноженная на 100
        available_portions:
          type: integer
          format: int64
          description: Сколько порций можно приготовить
        suggested_portions:
          type: integer
          format: int64
          description: Сколько порций стоит продать, чтобы израсходовать количество под риском
        reasons:
          type: array
          description: Продукты под риском, от самого весомого. У добавленного вручную блюда может быть пустым.
          items:
            $ref: "#/components/schemas/RecommendationReason"
        manual:
          $ref: "#/components/schemas/ManualOffer"
    ManualOffer:
      type: object
      description: Блюдо добавлено в горячие предложения вручную
      required: [comment, set_by, set_at]
      properties:
        comment:
          type: string
          description: Комментарий для официанта, может быть пустым
        set_by:
          $ref: "#/components/schemas/Actor"
        set_at:
          type: string
          format: date-time
    HotOfferMode:
      type: string
      enum: [pinned, hidden, auto]
    HotOfferChange:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/HotOfferMode"
        comment:
          type: string
          maxLength: 500
          description: Комментарий для официанта; учитывается у pinned
        time_zone:
          type: string
          description: |
            Часовой пояс точки, имя IANA (например, Europe/Moscow). Обязателен для hidden:
            скрытие действует до конца текущего дня в этом поясе, потом блюдо снова выбирает расчёт.
    HotOfferSetting:
      type: object
      required: [dish, mode, comment, set_by, set_at]
      properties:
        dish:
          $ref: "#/components/schemas/DishRef"
        mode:
          $ref: "#/components/schemas/HotOfferMode"
        comment:
          type: string
        set_by:
          $ref: "#/components/schemas/Actor"
        set_at:
          type: string
          format: date-time
        hidden_until:
          type: string
          format: date-time
          description: До какого момента действует скрытие; есть только у hidden
    HotOfferSettings:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HotOfferSetting"
    RecommendationReason:
      type: object
      required: [product, at_risk_quantity, batch_id, expires_at, hours_left, required_quantity, dishes_using,
                 urgency, coverage, significance, exclusivity]
      properties:
        product:
          $ref: "#/components/schemas/Product"
        at_risk_quantity:
          type: integer
          format: int64
          description: Сумма остатков партий продукта, истекающих в пределах горизонта
        batch_id:
          type: string
          format: uuid
          description: Партия с ближайшим сроком годности
        expires_at: {type: string, format: date-time}
        hours_left:
          type: integer
          format: int32
          description: Полных часов до окончания срока годности этой партии
        required_quantity:
          type: integer
          format: int64
          description: Количество продукта на одну порцию блюда
        dishes_using:
          type: integer
          format: int32
          description: Сколько доступных блюд используют продукт
        urgency: {type: number, format: double, description: "Срочность, от 0 до 1"}
        coverage: {type: number, format: double, description: "Доля количества под риском, которую блюдо способно израсходовать"}
        significance: {type: number, format: double, description: "Меньше 1, если под риском меньше одной порции"}
        exclusivity: {type: number, format: double, description: "1 у единственного потребителя продукта, стремится к 0.5"}
    DishRecommendationPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DishRecommendation"
        total:
          type: integer
          format: int64
          description: Общее число элементов без учёта limit и offset
    DeliveryRecommendation:
      type: object
      required: [product, available_quantity, consumed_quantity, suggested_quantity, reason, needed_by]
      properties:
        product:
          $ref: "#/components/schemas/Product"
        available_quantity:
          type: integer
          format: int64
          description: Доступный остаток - партии с неистёкшим сроком годности
        consumed_quantity:
          type: integer
          format: int64
          description: Расход под заказы за период расчёта
        cover_hours:
          type: number
          format: double
          description: На сколько часов хватит остатка при таком расходе. Нет, если расхода за период не было.
        suggested_quantity:
          type: integer
          format: int64
          description: Рекомендуемое количество поставки, в единице продукта
        reason:
          type: string
          enum: [out_of_stock, low_cover]
        needed_by:
          type: array
          description: Блюда, в рецептуру которых входит продукт
          items:
            $ref: "#/components/schemas/DishRef"
    DeliveryRecommendationPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryRecommendation"
        total:
          type: integer
          format: int64
          description: Общее число элементов без учёта limit и offset
    WriteOffStatistic:
      type: object
      required: [product, reason, quantity, operations]
      properties:
        product:
          $ref: "#/components/schemas/Product"
        reason:
          $ref: "#/components/schemas/WriteOffReason"
        quantity:
          type: integer
          format: int64
          description: Суммарное списанное количество в единице продукта
        operations:
          type: integer
          format: int64
          description: Число операций списания
    WriteOffStatistics:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WriteOffStatistic"
    WriteOffDay:
      type: object
      required: [day, product, reason, quantity, operations]
      properties:
        day:
          type: string
          format: date
          description: День в часовом поясе запроса
        product:
          $ref: "#/components/schemas/Product"
        reason:
          $ref: "#/components/schemas/WriteOffReason"
        quantity:
          type: integer
          format: int64
          description: Суммарное списанное количество в единице продукта
        operations:
          type: integer
          format: int64
          description: Число операций списания
    WriteOffDays:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: По дням от раннего к позднему
          items:
            $ref: "#/components/schemas/WriteOffDay"
    ShortageStatistic:
      type: object
      required: [product, rejected_orders, stop_entries, stop_seconds]
      properties:
        product:
          $ref: "#/components/schemas/Product"
        rejected_orders:
          type: integer
          format: int64
          description: Число заказов, отклонённых из-за продукта
        stop_entries:
          type: integer
          format: int64
          description: Число попаданий использующих продукт блюд в стоп-лист
        stop_seconds:
          type: integer
          format: int64
          description: Суммарное время влияния продукта на блюда в стоп-листе
    ShortageStatistics:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShortageStatistic"
    StopListForecast:
      type: object
      required: [dish, limiting_product, expected_at, available_quantity, required_quantity, consumption_per_hour, cause]
      properties:
        dish:
          $ref: "#/components/schemas/DishRef"
        limiting_product:
          $ref: "#/components/schemas/Product"
        expected_at:
          type: string
          format: date-time
          description: Ожидаемый момент попадания блюда в стоп-лист
        available_quantity:
          type: integer
          format: int64
          description: Годный остаток ограничивающего продукта на момент запроса, в единице продукта
        required_quantity:
          type: integer
          format: int64
          description: Количество ограничивающего продукта на порцию блюда
        consumption_per_hour:
          type: number
          format: double
          description: Средний расход ограничивающего продукта в час, по которому построен прогноз. Без расхода - 0
        cause:
          $ref: "#/components/schemas/StopListForecastCause"
    StopListForecastCause:
      type: string
      enum: [consumption, expiry]
      description: Почему продукта не хватит - его израсходуют или истечёт срок годности партии
    StopListForecasts:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StopListForecast"
    WriteOffReason:
      type: string
      enum: [expired, transport_damage, storage_violation, physical_damage, quality_issue, other]
    WriteOff:
      type: object
      required: [quantity, reason, comment]
      properties:
        quantity: {type: integer, format: int64, minimum: 1, maximum: 1000000000000}
        reason:
          $ref: "#/components/schemas/WriteOffReason"
        comment: {type: string, maxLength: 1000}
    Adjustment:
      type: object
      required: [delta, reason]
      properties:
        delta:
          type: integer
          format: int64
          minimum: -1000000000000
          maximum: 1000000000000
          description: Изменение остатка со знаком
        reason: {type: string, maxLength: 1000}
        comment: {type: string, maxLength: 1000}
    NewOrder:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
    OrderItem:
      type: object
      required: [dish_id, portions]
      properties:
        dish_id: {type: string, format: uuid}
        portions: {type: integer, format: int64, minimum: 1, maximum: 10000}
        dish_name:
          type: string
          readOnly: true
          description: Название блюда. Заполняется в ответе, в запросе игнорируется.
    DeliveryPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
        total:
          type: integer
          format: int64
          description: Общее число элементов без учёта limit и offset
    OrderPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
          format: int64
          description: Общее число элементов без учёта limit и offset
    OrderCancellation:
      type: object
      properties:
        comment:
          type: string
          maxLength: 1000
          description: Комментарий к отмене. Пустой или из одних пробелов не сохраняется
    Order:
      type: object
      required: [id, point_id, status, items, shortages, placed_by]
      properties:
        id: {type: string, format: uuid}
        point_id: {type: string, format: uuid}
        status: {type: string, enum: [accepted, rejected, cancelled]}
        placed_at:
          type: string
          format: date-time
          description: Время оформления заказа
        cancelled_at:
          type: string
          format: date-time
          description: Время отмены - только у отменённого заказа
        placed_by:
          $ref: "#/components/schemas/Actor"
          description: Кто оформил заказ. У заказа Мигома - сервисная учётная запись migom-integration
        cancelled_by:
          $ref: "#/components/schemas/Actor"
          description: Кто отменил заказ - только у отменённого заказа
        cancel_comment:
          type: string
          description: Комментарий к отмене - только у отменённого заказа, если его оставили
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        shortages:
          type: array
          description: Недостающие продукты. Заполнено только у отклонённого заказа.
          items:
            $ref: "#/components/schemas/Shortage"
    Shortage:
      type: object
      required: [product_id, required_quantity, available_quantity]
      properties:
        product_id: {type: string, format: uuid}
        product:
          $ref: "#/components/schemas/Product"
          description: Продукт из каталога, подставляется при ответе. Нет, если продукта в каталоге нет.
        required_quantity: {type: integer, format: int64}
        available_quantity: {type: integer, format: int64}
    MigomOnPoint:
      type: object
      required: [outlet_id]
      properties:
        outlet_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Номер заведения в Мигоме, null - Мигом не подключён
    MigomPoint:
      type: object
      required: [point_id, outlet_id]
      properties:
        point_id:
          type: string
          format: uuid
        outlet_id:
          type: integer
          format: int64
          description: Номер заведения в Мигоме
    NewSupplier:
      type: object
      required: [name, point_ids]
      properties:
        name: {type: string, maxLength: 200}
        point_ids:
          type: array
          description: Работающие точки компании, хотя бы одна
          items: {type: string, format: uuid}
    Supplier:
      type: object
      required: [id, company_id, name, point_ids, key_active, created_at]
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        name: {type: string}
        point_ids:
          type: array
          items: {type: string, format: uuid}
        key_active:
          type: boolean
          description: Действует ли ключ; false - ключ отозван
        key:
          type: string
          description: Ключ поставщика. Есть только в ответе на создание и выпуск ключа
        created_at: {type: string, format: date-time}
    SupplierSelf:
      type: object
      required: [id, name, company_id, company_name, points]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        company_id: {type: string, format: uuid}
        company_name: {type: string}
        points:
          type: array
          description: Работающие точки поставщика
          items:
            $ref: "#/components/schemas/SupplierPoint"
    SupplierPoint:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    GeneratorSettings:
      type: object
      required: [running, deliveries_per_minute, orders_per_minute]
      properties:
        running:
          type: boolean
          description: Создаёт ли генератор поставки и заказы
        deliveries_per_minute:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
        orders_per_minute:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
        updated_at:
          type: string
          format: date-time
          readOnly: true
    GeneratorPoint:
      type: object
      required: [point_id, company_id, deliveries_per_minute, orders_per_minute]
      properties:
        point_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
          description: Компания точки; из её каталога генератор берёт продукты и блюда
        deliveries_per_minute:
          type: integer
          format: int32
        orders_per_minute:
          type: integer
          format: int32
    Problem:
      type: object
      description: Описание ошибки по RFC 9457
      required: [type, title, status]
      properties:
        type:
          type: string
          description: >-
            Машиночитаемый вид ошибки. У 409: delivery-already-approved, delivery-not-approved,
            quarantine-closed, version-conflict (запрос можно повторить), conflict - остальные
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
        errors:
          type: array
          description: Некорректные поля запроса, только для ошибок валидации
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
          description: >-
            Вид ошибки, если он различим: expired - срок годности истёк к моменту действия,
            stock-consumed - принятое количество нельзя уменьшить ниже уже израсходованного
        limit:
          type: integer
          format: int64
          description: Предел для stock-consumed - на сколько можно уменьшить принятое количество
